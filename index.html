<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Horário Equipas SB Vidros 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#121212;
    --card:#1f1f1f;
    --muted:#a0a0a0;
    --text-primary:#f0f0f0;
    --border-color: rgba(255,255,255,0.08);
    --shadow-color: rgba(0,0,0,0.4);
    --highlight-color: #0b6bff;
    --sidebar-width: 280px;
    /* Cor de destaque para Fim de Semana e Feriados */
    --accent-day: #ff9800; 
  }
  html[data-theme='light']{
    --bg:#f5f6f8;
    --card:#ffffff;
    --muted:#6b6f76;
    --text-primary:#222;
    --border-color: rgba(0,0,0,0.1);
    --shadow-color: rgba(0,0,0,0.1);
    --accent-day: #e65100;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Roboto, system-ui, sans-serif;
    background:var(--bg);
    color:var(--text-primary);
    transition: background-color .3s;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Destaque para o número do dia em fins de semana ou feriados */
  .day.special-day .date {
    color: var(--accent-day) !important;
    font-weight: 900;
    text-shadow: 0px 0px 1px rgba(0,0,0,0.2);
  }
  
  .day.weekend {
    background: rgba(255, 152, 0, 0.05);
  }

  /* Botão de Definições Flutuante */
  #menu-toggle {
    position: fixed;
    top: 20px;
    left: 20px;
    z-index: 1000;
    background: var(--highlight-color);
    color: white;
    border: none;
    width: 45px;
    height: 45px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 12px var(--shadow-color);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
  }

  /* Painel Lateral */
  #side-panel {
    width: var(--sidebar-width);
    background: var(--card);
    border-right: 1px solid var(--border-color);
    padding: 80px 20px 20px 20px;
    height: 100vh;
    position: fixed;
    top: 0;
    left: calc(var(--sidebar-width) * -1);
    overflow-y: auto;
    z-index: 900;
    transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 5px 0 15px var(--shadow-color);
  }
  #side-panel.open { left: 0; }

  #menu-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    z-index: 850;
  }
  #menu-overlay.show { display: block; }

  main {
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  header {
    width: 100%;
    max-width: 1100px;
    margin-bottom: 20px;
    padding-left: 60px;
  }
  h1 { margin: 0; font-size: 24px; font-weight: 700; }
  .sub { color: var(--muted); font-size: 14px; }

  .setting-group { margin-bottom: 25px; }
  .setting-group label { display: block; font-weight: 600; margin-bottom: 10px; font-size: 13px; color: var(--highlight-color); text-transform: uppercase; }
  .radio-group { display: flex; flex-direction: column; gap: 8px; }
  .radio-group.row { flex-direction: row; flex-wrap: wrap; }
  .radio-group input { display: none; }
  .radio-group label {
    padding: 10px; border: 1px solid var(--border-color); border-radius: 8px;
    cursor: pointer; font-size: 14px; background: var(--bg); text-align: center; flex: 1;
  }
  .radio-group input:checked + label { background: var(--highlight-color); color: #fff; border-color: var(--highlight-color); }

  /* Grelha */
  .calendar-wrap { width: 100%; max-width: 1100px; }
  .month-container { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 30px; border: 1px solid var(--border-color); }
  .month-title { font-size: 18px; font-weight: 700; margin-bottom: 15px; border-left: 4px solid var(--highlight-color); padding-left: 10px; }
  .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
  .weekday { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 8px; font-weight: 700; }
  .day {
    background: var(--bg); border-radius: 8px; padding: 8px; min-height: 90px;
    border: 1px solid var(--border-color); cursor: pointer; display: flex; flex-direction: column;
    transition: transform 0.1s;
  }
  .day:active { transform: scale(0.95); }
  .day.today { border: 2px solid var(--highlight-color); background: rgba(11, 107, 255, 0.05); }
  
  /* Badges e Cores */
  .date { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
  .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
  .shift { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; }
  
  .A{background:#ffd700;color:#222} .B{background:#0b6b2f} .C{background:#1e90ff} .D{background:#ff00d4} .E{background:#8b0000}
  
  /* Estilos Lista */
  .list-container { background: var(--card); border-radius: 12px; border: 1px solid var(--border-color); overflow: hidden; }
  .list-row { display: grid; grid-template-columns: 50px 80px 1fr; padding: 12px; border-bottom: 1px solid var(--border-color); cursor: pointer; align-items: center; }
  .list-row.today { background: rgba(11, 107, 255, 0.1); border-left: 4px solid var(--highlight-color); }
  .list-row.special-day div:first-child { color: var(--accent-day); font-weight: bold; }
  .list-shifts { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; text-align: center; }
  .list-shift-item { padding: 4px 0; border-radius: 6px; font-size: 12px; font-weight: 700; }
  .list-shift-item.empty { color: var(--muted); opacity: 0.3; }

  /* Vista Equipa */
  .team-tag { font-size: 11px; font-weight: 800; padding: 6px; border-radius: 6px; text-align: center; margin-top: auto; text-transform: uppercase; }
  .st-M { background: #ffd700; color: #000; }
  .st-T { background: #0b6b2f; color: #fff; }
  .st-N { background: #1e90ff; color: #fff; }
  .st-F, .st-D { background: #333; color: #999; }
  .st-V { border: 2px solid var(--highlight-color); color: var(--highlight-color); }

  /* Popups */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; z-index: 2000; }
  .popup { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--card); padding: 25px; border-radius: 16px; width: 350px; display: none; z-index: 2100; }
  .pop-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border-color); }

  /* Navegação */
  .month-nav { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 25px; background: var(--card); padding: 10px; border-radius: 50px; }
  .nav-btn { background: var(--highlight-color); border: none; color: white; width: 35px; height: 35px; border-radius: 50%; cursor: pointer; }
</style>
</head>
<body data-theme="dark">

<button id="menu-toggle" onclick="toggleMenu()">⚙️</button>
<div id="menu-overlay" onclick="toggleMenu()"></div>

<nav id="side-panel">
  <div class="setting-group">
    <label>Exibição</label>
    <div class="radio-group">
      <input type="radio" id="m-grid" name="display-mode" value="grid" checked><label for="m-grid">Grelha</label>
      <input type="radio" id="m-list" name="display-mode" value="list"><label for="m-list">Lista</label>
      <input type="radio" id="m-team" name="display-mode" value="team"><label for="m-team">Vista Equipa</label>
    </div>
  </div>

  <div id="team-selector-box" class="setting-group" style="display:none;">
    <label>Escolher Equipa</label>
    <div class="radio-group row">
      <input type="radio" id="eq-a" name="team-sel" value="A" checked><label for="eq-a">A</label>
      <input type="radio" id="eq-b" name="team-sel" value="B"><label for="eq-b">B</label>
      <input type="radio" id="eq-c" name="team-sel" value="C"><label for="eq-c">C</label>
      <input type="radio" id="eq-d" name="team-sel" value="D"><label for="eq-d">D</label>
      <input type="radio" id="eq-e" name="team-sel" value="E"><label for="eq-e">E</label>
    </div>
  </div>

  <div class="setting-group">
    <label>Período</label>
    <div class="radio-group">
      <input type="radio" id="v-all" name="view-mode" value="all" checked><label for="v-all">Ano 2026</label>
      <input type="radio" id="v-single" name="view-mode" value="single"><label for="v-single">Mês Atual</label>
    </div>
  </div>

  <div class="setting-group">
    <label>Tema</label>
    <div class="radio-group row">
      <input type="radio" id="t-dark" name="theme" value="dark" checked><label for="t-dark">Escuro</label>
      <input type="radio" id="t-light" name="theme" value="light"><label for="t-light">Claro</label>
    </div>
  </div>
</nav>

<main>
  <header>
    <h1>2026</h1>
    <div class="sub">Escalas SB Vidros</div>
  </header>
  <div class="month-nav" id="month-nav" style="display:none;">
    <button class="nav-btn" onclick="navMonth(-1)">❮</button>
    <h2 id="current-month-label" style="margin:0; font-size: 18px;">Janeiro</h2>
    <button class="nav-btn" onclick="navMonth(1)">❯</button>
  </div>
  <div class="calendar-wrap" id="calendar-container"></div>
</main>

<div class="overlay" id="overlay" onclick="closePopup()"></div>
<div class="popup" id="popup">
  <h3 id="pop-title" style="margin-top:0; color: var(--highlight-color);"></h3>
  <div id="pop-content"></div>
  <button style="width:100%; padding:12px; background:var(--highlight-color); color:white; border:none; border-radius:8px; margin-top:20px; cursor:pointer;" onclick="closePopup()">Fechar</button>
</div>

// DADOS DE ESCALA ORIGINAIS (NÃO ALTERAR)

// FERIADOS PORTUGAL 2026
const holidays = [
  "2026-01-01", // Ano Novo
  "2026-04-03", // Sexta Santa
  "2026-04-05", // Páscoa
  "2026-04-25", // Liberdade
  "2026-05-01", // Trabalhador
  "2026-06-04", // Corpo de Deus
  "2026-06-10", // Dia de Portugal
  "2026-08-15", // Assunção de Nossa Sra
  "2026-10-05", // República
  "2026-11-01", // Todos os Santos
  "2026-12-01", // Restauração
  "2026-12-08", // Imaculada Conceição
  "2026-12-25"  // Natal
];

const schedule = scheduleText.split('\n').filter(l => l.trim()).map(l => l.replace(/\s/g, '').padEnd(6, '-'));
let state = { theme: 'dark', displayMode: 'grid', viewMode: 'all', selectedTeam: 'A', currentMonth: new Date().getMonth() };

function isHoliday(date) {
  const s = date.toISOString().split('T')[0];
  return holidays.includes(s);
}

function toggleMenu() {
  document.getElementById('side-panel').classList.toggle('open');
  document.getElementById('menu-overlay').classList.toggle('show');
}

function init() {
  document.querySelectorAll('input[name="theme"]').forEach(r => r.onchange = (e) => setTheme(e.target.value));
  document.querySelectorAll('input[name="display-mode"]').forEach(r => r.onchange = (e) => setDisplay(e.target.value));
  document.querySelectorAll('input[name="view-mode"]').forEach(r => r.onchange = (e) => setView(e.target.value));
  document.querySelectorAll('input[name="team-sel"]').forEach(r => r.onchange = (e) => { state.selectedTeam = e.target.value; render(); });
  render();
}

function setTheme(v) { state.theme = v; document.documentElement.setAttribute('data-theme', v); }
function setDisplay(v) { 
  state.displayMode = v; 
  document.getElementById('team-selector-box').style.display = (v === 'team') ? 'block' : 'none';
  render(); 
}
function setView(v) { 
  state.viewMode = v; 
  document.getElementById('month-nav').style.display = (v === 'single') ? 'flex' : 'none';
  render(); 
}
function navMonth(d) { state.currentMonth = (state.currentMonth + d + 12) % 12; render(); }

function render() {
  const container = document.getElementById('calendar-container');
  container.innerHTML = '';
  const today = new Date();
  const is2026 = today.getFullYear() === 2026;
  
  const start = state.viewMode === 'single' ? state.currentMonth : 0;
  const end = state.viewMode === 'single' ? state.currentMonth : 11;

  if (state.viewMode === 'single') {
    const d = new Date(year, state.currentMonth, 1);
    document.getElementById('current-month-label').textContent = d.toLocaleDateString('pt-PT', {month:'long', year:'numeric'}).toUpperCase();
  }

  let dayIdx = 0;
  for(let m=0; m<start; m++) dayIdx += new Date(year, m+1, 0).getDate();

  for (let m = start; m <= end; m++) {
    const daysInMonth = new Date(year, m + 1, 0).getDate();
    const monthDiv = document.createElement('div');
    monthDiv.className = 'month-container';
    monthDiv.innerHTML = `<div class="month-title">${new Date(year, m, 1).toLocaleDateString('pt-PT', {month:'long'}).toUpperCase()}</div>`;
    
    if (state.displayMode === 'list') {
        const list = document.createElement('div');
        list.className = 'list-container';
        
        const header = document.createElement('div');
        header.className = 'list-row';
        header.style.fontWeight = 'bold';
        header.style.background = 'rgba(0,0,0,0.1)';
        header.innerHTML = `<div>Dia</div><div>Sem.</div><div class="list-shifts"><div>M</div><div>T</div><div>N</div><div>F</div><div>D</div><div>V</div></div>`;
        list.appendChild(header);

        for (let d = 1; d <= daysInMonth; d++) {
            const dateObj = new Date(year, m, d);
            const curIdx = dayIdx;
            const isToday = is2026 && today.getMonth() === m && today.getDate() === d;
            const weekday = dateObj.getDay();
            const special = (weekday === 0 || weekday === 6 || isHoliday(dateObj));
            
            const row = document.createElement('div');
            row.className = 'list-row' + (isToday ? ' today' : '') + (special ? ' special-day' : '');
            if(isToday) row.id = 'target-today';
            row.onclick = () => openPopup(dateObj, curIdx);
            
            const s = schedule[dayIdx];
            let shiftsHtml = '';
            for(let i=0; i<6; i++) {
                const letter = s[i] || '-';
                shiftsHtml += `<div class="list-shift-item ${letter !== '-' ? letter : 'empty'}">${letter}</div>`;
            }
            
            row.innerHTML = `<div>${d}</div><div style="color:var(--muted)">${dateObj.toLocaleDateString('pt-PT', {weekday:'short'})}</div><div class="list-shifts">${shiftsHtml}</div>`;
            list.appendChild(row);
            dayIdx++;
        }
        monthDiv.appendChild(list);
    } else {
        const grid = document.createElement('div');
        grid.className = 'calendar';
        ['D','S','T','Q','Q','S','S'].forEach(wd => grid.innerHTML += `<div class="weekday">${wd}</div>`);
        
        const firstDayWeekday = new Date(year, m, 1).getDay();
        for(let i=0; i<firstDayWeekday; i++) grid.innerHTML += `<div></div>`;
        
        for (let d = 1; d <= daysInMonth; d++) {
            const curIdx = dayIdx;
            const dateObj = new Date(year, m, d);
            const weekday = dateObj.getDay();
            const isWeekend = (weekday === 0 || weekday === 6);
            const isHolid = isHoliday(dateObj);
            const isToday = is2026 && today.getMonth() === m && today.getDate() === d;
            
            const dayDiv = document.createElement('div');
            dayDiv.className = 'day' + (isToday ? ' today' : '') + (isWeekend ? ' weekend' : '') + (isWeekend || isHolid ? ' special-day' : '');
            if(isToday) dayDiv.id = 'target-today';
            dayDiv.onclick = () => openPopup(dateObj, curIdx);
            
            let html = `<div class="date">${d}</div>`;
            if (state.displayMode === 'team') {
                const s = schedule[dayIdx];
                let res = {c:'-', l:'-'};
                if(s[0]===state.selectedTeam) res={c:'M',l:'Manhã'};
                else if(s[1]===state.selectedTeam) res={c:'T',l:'Tarde'};
                else if(s[2]===state.selectedTeam) res={c:'N',l:'Noite'};
                else if(s[3]===state.selectedTeam) res={c:'F',l:'Folga'};
                else if(s[4]===state.selectedTeam) res={c:'D',l:'Descanso'};
                else if(s[5]===state.selectedTeam) res={c:'V',l:'Férias'};
                html += `<div class="team-tag st-${res.c}">${res.l}</div>`;
            } else {
                html += `<div class="badges">`;
                for(let i=0; i<5; i++) if(schedule[dayIdx][i]!=='-') html += `<div class="shift ${schedule[dayIdx][i]}">${schedule[dayIdx][i]}</div>`;
                html += `</div>`;
            }
            dayDiv.innerHTML = html;
            grid.appendChild(dayDiv);
            dayIdx++;
        }
        monthDiv.appendChild(grid);
    }
    container.appendChild(monthDiv);
  }
  
  setTimeout(() => {
    const target = document.getElementById('target-today');
    if(target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 100);
}

function openPopup(date, idx) {
  document.getElementById('pop-title').textContent = date.toLocaleDateString('pt-PT', {weekday:'long', day:'numeric', month:'long'});
  const s = schedule[idx];
  const labels = ['Manhã (05-13h)', 'Tarde (13-21h)', 'Noite (21-05h)', 'Folga', 'Descanso', 'Férias'];
  let html = '';
  for(let i=0; i<6; i++) {
    html += `<div class="pop-row"><div class="shift ${s[i]!=='--'?s[i]:''}" style="${s[i]==='-'?'background:#444':''}">${s[i]}</div><div><strong>${labels[i]}</strong><br><small>${s[i]!=='-'?'Equipa '+s[i]:'---'}</small></div></div>`;
  }
  document.getElementById('pop-content').innerHTML = html;
  document.getElementById('overlay').style.display = 'block';
  document.getElementById('popup').style.display = 'block';
}

function closePopup() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('popup').style.display = 'none';
}

init();
</script>
</body>
</html>
